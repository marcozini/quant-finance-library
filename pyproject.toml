[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-finance-library"
version = "0.1.0"
description = "A quantitative finance Python library"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "requests",
    "yfinance",
    "openpyxl",
    "reportlab",
    "pillow",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

notebooks = [
    "plotly",
    "ipykernel",
    "jupyter",
]

[tool.setuptools.packages.find]
include = ["quant_finance*"]